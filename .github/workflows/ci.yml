name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  java:
    name: Java tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: bash ./mvnw -q test

  remotion:
    name: Remotion typecheck and still render
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-generator
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: video-generator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Render sanity frame
        run: npx remotion still src/index.tsx KevinPromo /tmp/socialmedia-kevinpromo-frame120.png --frame=120 --scale=0.25
